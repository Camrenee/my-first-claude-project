# Refreshes data/jobs.json from the Greenhouse, Lever and Ashby public job boards.
# Runs every 6 hours and on demand; commits only when the job list changed.
name: Refresh jobs

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch jobs
        run: node scripts/fetch-jobs.mjs

      - name: Commit if changed
        run: |
          # generatedAt changes every run; only commit when the jobs themselves changed.
          if git diff --quiet -- data/jobs.json; then echo "No changes"; exit 0; fi
          if [ "$(git show HEAD:data/jobs.json 2>/dev/null | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.stringify(JSON.parse(d).jobs))}catch{console.log("")}})')" = "$(node -e 'console.log(JSON.stringify(require("./data/jobs.json").jobs))')" ]; then
            echo "Only the timestamp changed"; git checkout -- data/jobs.json; exit 0
          fi
          git config user.name "job-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git commit -m "Refresh jobs ($(node -e 'console.log(require("./data/jobs.json").count)') roles)"
          git push
